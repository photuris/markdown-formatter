name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: >
          tar -C target/${{ matrix.target }}/release
          -czf mdfmt-${{ github.ref_name }}-${{ matrix.target }}.tar.gz mdfmt
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: >
          7z a mdfmt-${{ github.ref_name }}-${{ matrix.target }}.zip
          ./target/${{ matrix.target }}/release/mdfmt.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mdfmt-*.tar.gz
            mdfmt-*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
